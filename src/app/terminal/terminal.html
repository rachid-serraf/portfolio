<!-- Terminal -->
<section
  class="mt-8 bg-[var(--bg-surface)]/95 backdrop-blur-md border border-[var(--border)] rounded-3xl p-6 sm:p-8 shadow-2xl relative"
  data-purpose="interactive-terminal">
  <div class="flex flex-wrap items-center justify-between gap-4 border-b border-[var(--border-inset)] pb-4 mb-6">
    <div class="flex items-center space-x-3">
      <div class="flex items-center space-x-2">
        <span class="w-3 h-3 rounded-full bg-cyber-coral inline-block"></span>
        <span class="w-3 h-3 rounded-full bg-cyber-ochre inline-block"></span>
        <span class="w-3 h-3 rounded-full bg-cyber-neon inline-block"></span>
      </div>
      <span class="font-mono text-xs text-[var(--text-tertiary)]">rachid@portfolio:~ (bash/zsh)</span>
    </div>
    <div class="flex items-center space-x-2 font-mono text-xs" data-purpose="terminal-controls">
      <span class="text-[var(--text-muted)] text-[11px] hidden sm:inline">SELECT QUERY:</span>
      @for (command of commands; track command.key) {
        <button [class]="active() === command.key ? tabOn : tabOff" (click)="select(command.key)">{{ command.label
          }}</button>
      }
    </div>
  </div>
  <div
    class="font-mono text-sm sm:text-base leading-relaxed text-[var(--text-secondary)] bg-[var(--bg-inset)]/80 p-5 rounded-2xl border border-[var(--border-inset)]/90 min-h-[150px] flex flex-col justify-center"
    data-purpose="terminal-screen">
    <p class="text-[var(--text-muted)] text-xs mb-1">$ <span class="cli-accent-text font-bold">{{ cmdDisplay() }}</span><span
        class="inline-block w-2 h-4 cli-accent-bg ml-1 animate-blink"></span></p>
    <p class="text-[var(--text-body)] font-medium">{{ textDisplay() }}</p>
    <div class="mt-3 flex flex-wrap gap-4 text-xs text-[var(--text-tertiary)]">
      @for (tag of tags(); track tag) {
        <span class="inline-flex items-center gap-1.5"><span class="w-2 h-2 rounded-full bg-cyber-neon"></span> {{ tag }}</span>
      }
    </div>
  </div>
</section>
