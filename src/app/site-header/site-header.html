<!-- Navigation -->
<header
  class="sticky top-0 z-50 backdrop-blur-md bg-[var(--bg-page)]/90 border-b border-[var(--border)]/70 px-4 sm:px-8 py-3.5 transition-all">
  <div class="max-w-7xl mx-auto flex items-center justify-between">
    <a aria-label="Rachid Serraf Home" class="flex items-center space-x-3 group" href="#">
      <div class="flex flex-col">
        <div class="flex items-center space-x-2">
          <span
            class="font-mono font-bold tracking-tight text-sm text-[var(--text-primary)] uppercase group-hover:text-cyber-orange transition-colors">Rachid
            Serraf</span>
          </div>
        <span class="text-[11px] font-mono text-[var(--text-muted)] tracking-wide">Full Stack &amp; Systems Builder</span>
      </div>
    </a>
    <nav
      class="hidden md:flex items-center space-x-1 lg:space-x-2 bg-[var(--bg-surface)]/80 px-3 py-1.5 rounded-full border border-[var(--border)]/80 text-xs font-mono">
      <a class="px-2 py-1.5 rounded-full text-[var(--text-tertiary)] hover:text-[var(--text-primary)] hover:bg-[var(--bg-raised)] transition"
        href="#about">01 // About</a>
      <a class="px-2 py-1.5 rounded-full text-[var(--text-tertiary)] hover:text-[var(--text-primary)] hover:bg-[var(--bg-raised)] transition"
        href="#workbench" (click)="tabJump.emit('projects')">02 // Projects</a>
      <a class="px-2 py-1.5 rounded-full text-[var(--text-tertiary)] hover:text-[var(--text-primary)] hover:bg-[var(--bg-raised)] transition"
        href="#stream">03 // Stream</a>
      <a class="px-2 py-1.5 rounded-full text-[var(--text-tertiary)] hover:text-[var(--text-primary)] hover:bg-[var(--bg-raised)] transition"
        href="#workbench" (click)="tabJump.emit('server')">04 // Server.yml</a>
      <a class="px-2 py-1.5 rounded-full text-[var(--text-tertiary)] hover:text-[var(--text-primary)] hover:bg-[var(--bg-raised)] transition"
        href="#workbench" (click)="tabJump.emit('stack')">05 // Stack.json</a>
      <a class="px-2 py-1.5 rounded-full text-[var(--text-tertiary)] hover:text-[var(--text-primary)] hover:bg-[var(--bg-raised)] transition"
        href="#experience">06 // Journey</a>
    </nav>
    <div class="flex items-center space-x-3">
      <button type="button" (click)="toggleTheme()"
        [attr.aria-label]="theme() === 'light' ? 'Switch to dark mode' : 'Switch to light mode'"
        [attr.title]="theme() === 'light' ? 'Dark mode' : 'Light mode'"
        class="h-8 w-8 rounded-lg bg-[var(--bg-raised)] border border-[var(--border)] text-[var(--text-secondary)] hover:text-[var(--text-primary)] hover:bg-[var(--bg-raised-2)] transition flex items-center justify-center">
        @if (theme() === 'light') {
          <svg aria-hidden="true" class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" viewBox="0 0 24 24">
            <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"></path>
          </svg>
        } @else {
          <svg aria-hidden="true" class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="4"></circle>
            <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"></path>
          </svg>
        }
      </button>
      <a class="hidden sm:inline-flex items-center space-x-1.5 font-mono text-xs px-3.5 py-2 rounded-lg bg-[var(--bg-raised)] hover:bg-[var(--bg-raised-2)] border border-[var(--border)] text-[var(--text-secondary)] transition hover:border-[var(--border-strong)]"
        href="https://github.com/rachid-serraf" rel="noopener noreferrer" target="_blank">
        <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24">
          <path
            d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z">
          </path>
        </svg>
        <span>GitHub</span>
      </a>
      <a class="inline-flex items-center space-x-2 font-mono text-xs font-bold px-4 py-2 rounded-lg bg-cyber-orange hover:bg-cyber-ochre text-noir-950 tracking-wider shadow-md shadow-cyber-orange/20 transition transform active:scale-95"
        href="https://www.linkedin.com/in/rachid-serraf" rel="noopener noreferrer" target="_blank">
        <span>HIRE ME</span><span class="text-sm font-bold">↗</span>
      </a>
    </div>
  </div>
</header>
